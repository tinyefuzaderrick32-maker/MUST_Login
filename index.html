<!DOCTYPE html>
<html lang="en">
  <head>
    <title>MUST | Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <di>
      <img src="\images\mustLogo.png" alt="MUST Logo" />
      <h1>MBARARA UNIVERSITY OF SCIENCE AND TECHNOLOGY</h1>
      <h3>Online Application Portal</h3>
    </di>
    <div class="login">
      <h2>Login</h2>
      <p>Enter your Student credentials to login into your account</p>
      <form action="#" method="post">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="Student Email" required />
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required />
        <button>Login</button>
        <a href=""><p>Forgot Password?</p></a>
        <p>Don't have an account? <a href="signUp.html">create Account</a></p>
      </form>
    </div>
  </body>
</html>
