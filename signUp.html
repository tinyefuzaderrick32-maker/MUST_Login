<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MUST | Create Account</title>
    <link rel="stylesheet" href="style2.css" />
  </head>
  <body>
    <div>
      <img src="images/mustLogo.png" alt="MUST Logo" />
      <h1>MBARARA UNIVERSITY OF SCIENCE AND TECHNOLOGY</h1>
      <h3>Online Application Portal</h3>
    </div>
    <div class="signup">
      <h2>Create Account</h2>
      <p>Fill in your details to create your student account</p>
      <form action="#" method="post">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Full Name" required />

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Student Email" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required />

        <label for="confirm">Confirm Password</label>
        <input
          type="password"
          id="confirm"
          placeholder="Confirm Password"
          required
        />

        <button>Create Account</button>
        <p>Already have an account? <a href="index.html">Login</a></p>
      </form>
    </div>
  </body>
</html>
